[project]
name = "superliga-prognose"
version = "0.1.0"
description = "Match forecasts for the Danish Superliga, measured against the betting market"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
superliga = "superliga.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
